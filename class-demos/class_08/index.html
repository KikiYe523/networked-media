<html>
  <!-- Q: What type of content goes inside the <head>? 
    Does it show up on the webpage? -->
  <!-- A: it contains info about the page, such as title, metadata, 
 links to css, but it doesn't appear on the page's visible content, 
 the title does appear in the browser tab-->

  <head>
    <title>class 6 demo 😌</title>
    <link href="style.css" rel="stylesheet" />
    <script src="main.js" defer></script>
  </head>

  <!-- Q: What type of content goes inside the <body>? 
    Does it show up on the webpage? -->
  <!-- A: the page's content such as text, image, links, buttons, etc, 
 does appear on webpate, it is the main page content -->

  <body>
    <p>this is a paragraph</p>
    <p class="blue">this is a second paragraph</p>
    <p id="main">this is a third paragraph</p>

    <!-- now open up style.css -->
  </body>
</html>
