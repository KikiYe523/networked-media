<!-- forms have 2 attributes -->
 <!-- action: route we are going to hit on the server side -->
  <!-- method: httpmethod we use (GET / POST) -->
<form action = "/form-upload" method="POST">
    <!-- any other input types needs to go before submit -->
     <!-- there are many types in a form -->
    <input type = "text" name="message" value="write some text"/>
    <!-- forms ahve one required item: submit button -->
    <input type = "submit" value="text in button"/>
</form>
